# The Stock: PostgreSQL + NestJS API + Next.js web.
#
#   docker compose up -d --build   # build images, run migrations, add example data, start everything
#   docker compose down            # stop; add -v to also drop the database volume
#
# Variables come from a `.env` file next to this file (see .env.example); every one has a default.
# The browser talks to the API directly, so NEXT_PUBLIC_API_URL / CORS_ORIGIN must match the
# host ports published below (API_PORT / WEB_PORT).

name: the-stock

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thestock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thestock}
      POSTGRES_DB: ${POSTGRES_DB:-thestock}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Uncomment to reach the database from the host (e.g. with a SQL client):
    # ports:
    #   - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thestock} -d ${POSTGRES_DB:-thestock}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Applies pending Prisma migrations on startup (see backend/Dockerfile), then serves the API.
  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-thestock}:${POSTGRES_PASSWORD:-thestock}@db:5432/${POSTGRES_DB:-thestock}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-use-a-long-random-secret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@thestock.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:${WEB_PORT:-3001}}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-300}
      LOGIN_THROTTLE_LIMIT: ${LOGIN_THROTTLE_LIMIT:-10}
      # Leave NODE_ENV unset over plain HTTP: in production mode the refresh cookie is marked
      # Secure and browsers only store it over HTTPS (localhost is the exception).
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:${API_PORT:-3000}}
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot: example data (3 products, 2 stock entries, 3 sales), only while there are no products.
  seed:
    build:
      context: ./backend
      target: builder
    command: ["npx", "prisma", "db", "seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-thestock}:${POSTGRES_PASSWORD:-thestock}@db:5432/${POSTGRES_DB:-thestock}
    # Healthy API = migrations applied.
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  db-data:
